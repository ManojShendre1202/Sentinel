<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Sentinel</title>
  <style>
    body { font-family: system-ui, sans-serif; width: 260px; padding: 10px; font-size: 13px; }

    #status.disconnected { color: #b00; }
    pre { background: #f5f5f5; padding: 6px; max-height: 160px; overflow: auto; white-space: pre-wrap; word-break: break-all; }
    button { margin-top: 6px; }
  </style>
</head>
<body>
  <div id="status">checking...</div>
  <div>Last message:</div>
  <pre id="lastMessage">(none)</pre>
  <button id="pingBtn">Send test ping</button>
  <button id="captureBtn">Capture active tab</button>
  <div>Last capture:</div>
  <pre id="lastCapture">(none)</pre>
  <script src="popup.js"></script>
</body>
</html>
