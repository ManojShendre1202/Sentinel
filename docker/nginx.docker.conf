worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include      mime.types;
    default_type application/octet-stream;

    sendfile       on;
    keepalive_timeout 65;

    # ── Upstreams — use Docker service names, not 127.0.0.1 ─────────────────
    upstream django_backend {
        server django:8130;
    }

    upstream extension_ws {
        server worker:8140;
    }

    # ── Plain HTTP — ACME challenge only, everything else redirects to HTTPS ──
    server {
        listen 80;
        # TODO: real domain not yet decided (placeholder — update before deploy)
        server_name sentinel.manojshendre.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS — the real app ───────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name sentinel.manojshendre.com;
        client_max_body_size 500M;

        ssl_certificate     /etc/letsencrypt/live/sentinel.manojshendre.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sentinel.manojshendre.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # ── Django API / admin / static ─────────────────────────────────────
        location /api/ {
            proxy_pass http://django_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /admin/ {
            proxy_pass http://django_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /static/ {
            proxy_pass http://django_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Extension WebSocket (worker process) ────────────────────────────
        location /ws/extension/ {
            proxy_pass         http://extension_ws;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;
        }
    }
}
